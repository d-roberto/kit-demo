<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Verifica kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.webgpu.min.js"></script>
<style>
  :root { --bg:#0b1020; --card:#121935; --linea:#1b2340; --txt:#f2f4fa; --mute:#9aa3c0; --tenue:#5d6688;
          --ok:#34d399; --ko:#f05252; --attesa:#fbbf24; --stato:#5d6688; --alone:rgba(93,102,136,.18); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font-family: "Space Grotesk", -apple-system, system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
         padding: max(18px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  body.ok { --stato: var(--ok); --alone: rgba(52,211,153,.18); }
  body.ko { --stato: var(--ko); --alone: rgba(240,82,82,.18); }
  body.attesa { --stato: var(--attesa); --alone: rgba(251,191,36,.16); }

  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 21px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .sub { font-size: 12px; color: var(--mute); }

  .vista { position: relative; aspect-ratio: 2994 / 2400; border-radius: 22px; overflow: hidden; background: #050814;
           border: 3px solid var(--stato); box-shadow: 0 0 0 6px var(--alone); transition: border-color .25s, box-shadow .25s; }
  #tela { width: 100%; height: 100%; display: block; }
  #vuoto { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
           color: var(--mute); font-size: 15px; line-height: 1.45; }
  #vuoto b { display: block; color: var(--txt); font-size: 17px; margin-bottom: 4px; }

  .centro { display: flex; justify-content: center; }
  .anello { position: relative; width: 200px; height: 200px; }
  .anello svg { display: block; }
  .anello circle { transition: stroke .25s; }
  .testo { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
  #numero { font-size: 54px; font-weight: 700; line-height: 1; }
  #numero span { color: var(--tenue); }
  #messaggio { font-size: 15px; font-weight: 600; color: var(--stato); max-width: 150px; line-height: 1.25; }

  #chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tondo { position: relative; width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--tenue);
           display: grid; place-items: center; background: rgba(255,255,255,.04); color: var(--tenue); transition: .2s; }
  .chip.si .tondo { border-color: var(--ok); color: var(--ok); }
  .chip.no .tondo { border-color: var(--ko); color: var(--ko); }
  .conta { position: absolute; top: -6px; right: -8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
           background: var(--txt); color: var(--bg); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .chip.no .conta { background: var(--ko); color: #fff; }
  .chip .nome { font-size: 12px; color: #c5cbe0; }

  #dati { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--linea);
          border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
  #dati div { padding: 9px 12px; display: flex; flex-direction: column; gap: 3px; background: var(--bg); }
  #dati small { font-size: 10px; letter-spacing: .1em; color: var(--tenue); }
  #dati b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .comandi { display: flex; gap: 10px; }
  #b_avvia { flex: 1; height: 52px; border: 0; border-radius: 999px; background: var(--txt); color: var(--bg);
             font: inherit; font-size: 16px; font-weight: 700; }
  #b_avvia:disabled { opacity: .4; }
  #b_avvia.ferma { background: transparent; color: var(--txt); border: 1px solid var(--linea); }
  .secondario { height: 52px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--linea); color: var(--txt);
                font-size: 15px; display: grid; place-items: center; white-space: nowrap; }
  #video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<main>
  <header><h1>Verifica kit</h1><span class="sub">YOLO26n · nel telefono</span></header>

  <div class="vista">
    <canvas id="tela"></canvas>
    <div id="vuoto"><div><b>Inquadra la busta</b>La busta deve riempire questo riquadro.<br>
      Il kit è completo con almeno una moneta, chiavi, una pila e un accendino.</div></div>
  </div>

  <div class="centro"><div class="anello">
    <svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="80" fill="none" stroke="#1b2340" stroke-width="14"></circle>
      <circle id="seg0" cx="100" cy="100" r="80" fill="none" stroke-width="14" stroke-linecap="round"></circle>
      <circle id="seg1" cx="100" cy="100" r="80" fill="none" stroke-width="14" stroke-linecap="round"></circle>
      <circle id="seg2" cx="100" cy="100" r="80" fill="none" stroke-width="14" stroke-linecap="round"></circle>
      <circle id="seg3" cx="100" cy="100" r="80" fill="none" stroke-width="14" stroke-linecap="round"></circle>
    </svg>
    <div class="testo" role="status" aria-live="polite"><div id="numero">–<span>/4</span></div><div id="messaggio">Caricamento…</div></div>
  </div></div>

  <div id="chips"></div>

  <div id="dati">
    <div><small>MODELLO</small><b id="d_modello">v2b</b></div>
    <div><small>BACKEND</small><b id="d_backend">–</b></div>
    <div><small>SOGLIA</small><b id="d_soglia">–</b></div>
    <div><small>TEMPO</small><b id="d_tempo">–</b></div>
    <div><small>FPS</small><b id="d_fps">–</b></div>
    <div><small>RILEVATI</small><b id="d_tot">–</b></div>
  </div>

  <div class="comandi">
    <button id="b_avvia" disabled>Avvia</button>
    <label class="secondario">Carica foto <input type="file" id="file" accept="image/*" hidden></label>
  </div>
</main>
<video id="video" playsinline muted></video>

<script>
// --- Configurazione -------------------------------------------------------------
const MODELLO = 'v2b';
const CLASSI = ['moneta_10c', 'altra_moneta', 'chiavi', 'pila_AAA', 'accendino'];
const TIPO_DI_CLASSE = [0, 0, 1, 2, 3];           // le due classi di monete contano come "moneta"
const ICONE = {
  moneta: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/>',
  chiavi: '<circle cx="7.5" cy="12" r="4"/><path d="M11.5 12H21M17 12v3M20 12v2"/>',
  pila: '<rect x="3" y="8" width="15" height="8" rx="2"/><path d="M20 11v2M7 12h4"/>',
  accendino: '<rect x="7" y="9" width="10" height="12" rx="2"/><path d="M12 2c1.6 1.8 2 3.3 0 5.2C10 5.3 10.4 3.8 12 2z"/>' };
const TIPI = [ { nome: 'moneta', col: '#fbbf24' }, { nome: 'chiavi', col: '#60a5fa' },
               { nome: 'pila', col: '#f472b6' }, { nome: 'accendino', col: '#fb923c' } ];
const LATO = 640, RAPPORTO = 2994 / 2400, STABILE_MS = 500;
const par = new URLSearchParams(location.search);
const SOGLIA = parseFloat(par.get('soglia') || '0.5');   // ?soglia=0.6 per cambiarla
const $ = id => document.getElementById(id);
let sessione, backend, attivo = false, rilevamenti = [], ritaglio = null, firma = '', dal = 0, tempi = [], blocco = null;

ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';
if (!self.crossOriginIsolated) ort.env.wasm.numThreads = 1;

// Anello: 4 segmenti, uno per tipo di oggetto
const C = 2 * Math.PI * 80, GAP = 26, SEG = C / 4 - GAP;
for (let i = 0; i < 4; i++) {
  const s = $('seg' + i);
  s.setAttribute('stroke-dasharray', `${SEG} ${C - SEG}`);
  s.setAttribute('transform', `rotate(${-90 + (GAP / 2) / C * 360 + i * 90} 100 100)`);
  s.setAttribute('stroke', '#2a3357');
}
$('chips').innerHTML = TIPI.map((t, i) => `<div class="chip" id="chip${i}"><div class="tondo">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONE[t.nome]}</svg>
  <span class="conta" id="conta${i}">0</span></div><div class="nome">${t.nome}</div></div>`).join('');
$('d_soglia').textContent = SOGLIA.toFixed(2);

function stato(classe, numero, messaggio) {
  document.body.className = classe;
  $('numero').innerHTML = `${numero}<span>/4</span>`;
  $('messaggio').textContent = messaggio;
}

// --- Modello ----------------------------------------------------------------------
async function caricaModello() {
  const forza = par.get('ep');                      // ?ep=wasm per forzare la CPU
  for (const ep of forza ? [forza] : (navigator.gpu ? ['webgpu', 'wasm'] : ['wasm'])) {
    try { sessione = await ort.InferenceSession.create('best.onnx', { executionProviders: [ep] }); backend = ep; break; }
    catch (e) { console.warn('Backend non disponibile:', ep, e); }
  }
  if (!sessione) { stato('ko', '!', 'Modello non caricato'); return; }
  await inferenza(new Float32Array(3 * LATO * LATO).fill(114 / 255));   // riscaldamento
  $('d_backend').textContent = backend === 'webgpu' ? 'WebGPU' : 'WASM';
  stato('', '–', 'Pronto');
  $('b_avvia').disabled = false;
}

async function inferenza(dati) {
  const out = await sessione.run({ [sessione.inputNames[0]]: new ort.Tensor('float32', dati, [1, 3, LATO, LATO]) });
  return out[sessione.outputNames[0]].data;          // 300 righe x [x1, y1, x2, y2, conf, classe]
}

// --- Preparazione dell'immagine, identica a Ultralytics (cv2.resize INTER_LINEAR + letterbox) ---
function ridimensiona(src, W, H, nw, nh) {
  const tab = (n, N) => {
    const i0 = new Int32Array(n), i1 = new Int32Array(n), c = new Int32Array(n), s = N / n;
    for (let d = 0; d < n; d++) {
      let f = (d + 0.5) * s - 0.5, k = Math.floor(f); f -= k;
      if (k < 0) { k = 0; f = 0; }
      if (k >= N - 1) { k = N - 1; f = 0; }
      i0[d] = k; i1[d] = Math.min(k + 1, N - 1); c[d] = Math.round((1 - f) * 2048);
    }
    return { i0, i1, c };
  };
  const X = tab(nw, W), Y = tab(nh, H), out = new Uint8Array(nw * nh * 3);
  for (let y = 0; y < nh; y++) {
    const b0 = Y.c[y], b1 = 2048 - b0, r0 = Y.i0[y] * W, r1 = Y.i1[y] * W;
    for (let x = 0; x < nw; x++) {
      const a0 = X.c[x], a1 = 2048 - a0;
      const p00 = (r0 + X.i0[x]) * 4, p01 = (r0 + X.i1[x]) * 4, p10 = (r1 + X.i0[x]) * 4, p11 = (r1 + X.i1[x]) * 4;
      for (let ch = 0; ch < 3; ch++) {
        const s0 = src[p00 + ch] * a0 + src[p01 + ch] * a1, s1 = src[p10 + ch] * a0 + src[p11 + ch] * a1;
        out[(y * nw + x) * 3 + ch] = ((((b0 * (s0 >> 4)) >> 16) + ((b1 * (s1 >> 4)) >> 16) + 2) >> 2);
      }
    }
  }
  return out;
}

let tmp = null;
function preparaImmagine(sorgente, { sx, sy, sw, sh }) {
  if (!tmp || tmp.width !== sw || tmp.height !== sh) tmp = new OffscreenCanvas(sw, sh);
  const g = tmp.getContext('2d', { willReadFrequently: true });
  g.drawImage(sorgente, sx, sy, sw, sh, 0, 0, sw, sh);           // solo ritaglio
  const src = g.getImageData(0, 0, sw, sh).data;
  const r = LATO / Math.max(sw, sh), nw = Math.round(sw * r), nh = Math.round(sh * r);
  const left = Math.floor((LATO - nw) / 2), top = Math.floor((LATO - nh) / 2);
  const img = ridimensiona(src, sw, sh, nw, nh), n = LATO * LATO;
  const dati = new Float32Array(3 * n).fill(114 / 255);
  for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) {
    const p = (y * nw + x) * 3, q = (y + top) * LATO + x + left;
    dati[q] = img[p] / 255; dati[n + q] = img[p + 1] / 255; dati[2 * n + q] = img[p + 2] / 255;
  }
  return { dati, r, left, top };
}

// Ritaglio: il rettangolo più grande con le proporzioni dell'addestramento, al centro
function riquadro(w, h) {
  let sw = w, sh = w / RAPPORTO;
  if (sh > h) { sh = h; sw = h * RAPPORTO; }
  return { sx: Math.round((w - sw) / 2), sy: Math.round((h - sh) / 2), sw: Math.round(sw), sh: Math.round(sh) };
}

async function rileva(sorgente, rq) {
  const { dati, r, left, top } = preparaImmagine(sorgente, rq);
  const u = await inferenza(dati), ril = [];
  for (let i = 0; i < 300; i++) {
    const [x1, y1, x2, y2, conf, c] = u.slice(6 * i, 6 * i + 6), cls = Math.round(c);
    if (conf >= SOGLIA && cls < CLASSI.length)
      ril.push({ tipo: TIPO_DI_CLASSE[cls], conf, x1: (x1 - left) / r, y1: (y1 - top) / r, x2: (x2 - left) / r, y2: (y2 - top) / r });
  }
  return ril;
}

// --- Esito: almeno un oggetto per tipo ---------------------------------------------
function valuta(dalVivo) {
  const conteggi = TIPI.map((_, i) => rilevamenti.filter(d => d.tipo === i).length);
  const presenti = conteggi.map(n => n > 0);
  presenti.forEach((p, i) => {
    $('chip' + i).className = 'chip ' + (p ? 'si' : 'no');
    $('conta' + i).textContent = conteggi[i];
    $('seg' + i).setAttribute('stroke', p ? '#34d399' : '#f05252');
  });
  const n = presenti.filter(Boolean).length;
  $('d_tot').textContent = rilevamenti.length;
  const sig = presenti.join(), ora = performance.now();
  if (sig !== firma) { firma = sig; dal = ora; }
  if (dalVivo && ora - dal < STABILE_MS) { stato('attesa', n, 'In verifica…'); return; }
  const mancanti = TIPI.filter((_, i) => !presenti[i]).map(t => t.nome);
  if (!mancanti.length) stato('ok', n, 'Kit completo');
  else stato('ko', n, mancanti.length === 1 ? `Manca: ${mancanti[0]}` : `Mancano: ${mancanti.join(', ')}`);
}

// --- Disegno -----------------------------------------------------------------------
function disegna(sorgente) {
  const t = $('tela'), rq = ritaglio, k = Math.min(1, 1200 / rq.sw);
  const W = Math.round(rq.sw * k), H = Math.round(rq.sh * k);
  if (t.width !== W || t.height !== H) { t.width = W; t.height = H; }
  const g = t.getContext('2d');
  g.drawImage(sorgente, rq.sx, rq.sy, rq.sw, rq.sh, 0, 0, W, H);
  const s = W / 600;
  g.lineWidth = 2.5 * s; g.font = `600 ${13 * s}px "Space Grotesk", system-ui, sans-serif`;
  for (const d of rilevamenti) {
    const x = d.x1 * k, y = d.y1 * k, w = (d.x2 - d.x1) * k, h = (d.y2 - d.y1) * k;
    g.strokeStyle = g.fillStyle = '#ffffff';
    g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, 8 * s) : g.rect(x, y, w, h); g.stroke();
    const testo = `${TIPI[d.tipo].nome} ${d.conf.toFixed(2)}`, tw = g.measureText(testo).width + 12 * s, th = 20 * s;
    const ty = y - th - 3 * s < 0 ? y + 3 * s : y - th - 3 * s;
    g.beginPath(); g.roundRect ? g.roundRect(x, ty, tw, th, 10 * s) : g.rect(x, ty, tw, th); g.fill();
    g.fillStyle = '#0b1020'; g.fillText(testo, x + 6 * s, ty + 14.5 * s);
  }
}

function anteprima() {                              // ~60 fps: video + ultimi riquadri
  if (!attivo) return;
  const v = $('video');
  if (v.videoWidth) { ritaglio = riquadro(v.videoWidth, v.videoHeight); disegna(v); }
  requestAnimationFrame(anteprima);
}

function mostraTempo(ms, fps) {
  $('d_tempo').textContent = `${Math.round(ms)} ms`;
  $('d_fps').textContent = fps ? fps.toFixed(1) : 'foto';
}

async function ciclo() {                            // inferenza continua, un fotogramma dopo l'altro
  const v = $('video');
  while (attivo) {
    if (!v.videoWidth) { await new Promise(r => setTimeout(r, 50)); continue; }
    const t0 = performance.now();
    rilevamenti = await rileva(v, riquadro(v.videoWidth, v.videoHeight));
    tempi = [...tempi.slice(-9), performance.now() - t0];
    const medio = tempi.reduce((a, b) => a + b) / tempi.length;
    mostraTempo(medio, 1000 / medio);
    if (attivo) valuta(true);
    await new Promise(r => setTimeout(r, 0));     // lascia spazio all'anteprima e ai tocchi
  }
}

// --- Comandi -----------------------------------------------------------------------
async function avvia() {
  try {
    const v = $('video');
    v.srcObject = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: 'environment', width: { ideal: 4032 }, height: { ideal: 3024 } } });
    await v.play();
    attivo = true; firma = ''; tempi = []; $('vuoto').style.display = 'none';
    $('b_avvia').textContent = 'Ferma'; $('b_avvia').classList.add('ferma');
    try { blocco = await navigator.wakeLock?.request('screen'); } catch (e) {}   // schermo sempre acceso
    anteprima(); ciclo();
  } catch (e) { stato('ko', '!', 'Fotocamera non disponibile'); console.warn(e); }
}

function ferma() {
  attivo = false;
  const v = $('video'); v.srcObject?.getTracks().forEach(t => t.stop()); v.srcObject = null;
  blocco?.release(); blocco = null;
  $('b_avvia').textContent = 'Avvia'; $('b_avvia').classList.remove('ferma');
}

$('b_avvia').onclick = () => attivo ? ferma() : avvia();

$('file').onchange = async ev => {                  // foto: stesso ritaglio centrale, esito immediato
  const f = ev.target.files[0]; if (!f) return;
  if (attivo) ferma();
  const img = await createImageBitmap(f, { colorSpaceConversion: 'none' });
  ritaglio = riquadro(img.width, img.height);
  const t0 = performance.now();
  rilevamenti = await rileva(img, ritaglio);
  mostraTempo(performance.now() - t0);
  $('vuoto').style.display = 'none'; disegna(img); firma = ''; valuta(false);
  ev.target.value = '';
};

caricaModello();
</script>
</body>
</html>
